# The server split into its parts, for local development.
#
#   docker compose up --build
#   python client_main.py --url ws://localhost:8765     (twice, in two terminals)
#
# None of this is needed to play. `python server_main.py --solo` runs the same gateway,
# the same shard and the same lobby in one process, with a dictionary where Redis is and
# a function call where NATS is. This file is for exercising the split itself.
#
# The credentials below are development credentials and are meant to be in the file:
# nothing outside this compose network can reach the database, and the point of S1 is
# that a fresh clone comes up with one command. A deployed environment gets them from a
# secret instead (S6 puts DATABASE_URL in a Kubernetes Secret).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kfchess
      POSTGRES_PASSWORD: kfchess
      POSTGRES_DB: kfchess
    volumes:
      # The data itself, so ratings survive `docker compose down`...
      - pgdata:/var/lib/postgresql/data
      # ...and the schema, which the official image runs once, when it initialises an
      # empty data directory. See migrations/001_initial.sql.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The server must not start against a database that is still starting up: its very
      # first statement is a CREATE TABLE.
      test: ["CMD-SHELL", "pg_isready -U kfchess -d kfchess"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      # Published so `psql` and the PostgreSQL integration tests can reach it from the
      # host (see tests/integration/). The server does not use this -- it talks to
      # `postgres:5432` inside the compose network -- so a deployment drops it.
      - "5432:5432"

  nats:
    image: nats:2-alpine
    # No volume: everything on this bus is in flight. A delta nobody was listening for
    # is not worth keeping, and the ten-second resync is what repairs a client that
    # missed one. (The one message that must not be lost, `game.finished`, is S2's
    # JetStream item and is not published yet.)
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15
    command: ["--http_port", "8222"]  # the monitoring port the healthcheck asks

  redis:
    image: redis:7-alpine
    # No volume, and that is deliberate. Everything here is state about *right now* --
    # which room ids are taken, who is waiting for a game, where a player is sitting --
    # and every key of it carries a time to live measured in minutes. Restoring a
    # yesterday's copy would repopulate the server with rooms that no longer exist. What
    # must survive a restart is accounts and ratings, and those are in PostgreSQL.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  shard:
    build: .
    command: ["python", "server_main.py"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kfchess:kfchess@postgres:5432/kfchess
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379/0
      KFC_SHARD_ID: sh1
    # No ports. Nothing outside this network can reach the shard, and nothing needs to:
    # players talk to a gateway, and the gateway talks to the bus. That is the split.
    restart: unless-stopped

  gateway:
    build: .
    command: ["python", "gateway_main.py"]
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
      KFC_GATEWAY_ID: gw1
      # Bind every interface: "localhost" inside a container means only the container.
      KFC_SERVER_HOST: 0.0.0.0
    ports:
      - "8765:8765"
    restart: unless-stopped

volumes:
  pgdata:
