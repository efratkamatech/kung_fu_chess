# What Prometheus asks, and of whom.
#
# Every service answers /metrics on the same port, so the only thing that differs is the
# hostname -- and `shard` resolves to *both* replicas, because compose gives a service's
# replicas one DNS name. Prometheus scrapes each address it finds and labels the result
# with which one answered, which is the whole reason the metrics themselves carry no
# labels: the scraper knows where it got them.

global:
  # Often enough to see a load test happen, rarely enough that the scrape is not itself
  # a load. The histograms are cumulative, so nothing is lost between scrapes.
  scrape_interval: 5s

scrape_configs:
  - job_name: shard
    dns_sd_configs:
      - names: ["shard"]
        type: A
        port: 9100

  - job_name: gateway
    static_configs:
      - targets: ["gateway:9100"]

  - job_name: auth
    dns_sd_configs:
      - names: ["auth"]
        type: A
        port: 9100
