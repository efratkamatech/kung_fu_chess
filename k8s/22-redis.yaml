# Redis: the state that has to be true across shards -- the waiting queue, the room-id
# space, the player directory, the pool of live shards.
#
# No volume here either, and deliberately. Everything in it is state about *right now* and
# every key of it carries a time to live measured in minutes, so restoring yesterday's
# copy would repopulate the cluster with rooms that no longer exist. What must survive a
# restart is accounts and ratings, and those are in PostgreSQL.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: kfchess
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      name: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: kfchess
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
