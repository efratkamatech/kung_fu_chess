# The gateways: they hold the sockets and cannot read what they carry.
#
# The only thing in the cluster a player talks to, and therefore the only thing with a
# published port. A NodePort rather than an Ingress: what arrives here is a WebSocket and
# not HTTP paths, so there is nothing for an ingress controller to route on -- it would be
# a proxy in front of a proxy.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: kfchess
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8765
      targetPort: ws
      nodePort: 30765
      name: ws
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: kfchess
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      # A gateway holds live WebSockets. Killing it is survivable -- S2 proved a game
      # outlives its gateway and a player can reconnect through another -- but it is still
      # a reconnect for everybody it was holding, so it is given time to be replaced
      # before it goes.
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: kfchess:local
          imagePullPolicy: IfNotPresent
          command: ["python", "gateway_main.py"]
          envFrom:
            - configMapRef:
                name: kfchess-env
          env:
            # A gateway's id prefixes every connection id it hands out, so the replies to
            # its sockets arrive on a subject only it is subscribed to. Two gateways
            # sharing an id would each receive the other's answers. Compose could hardcode
            # `gw1` because there was one; here the pod's own name is the only thing
            # guaranteed unique, and taking it from the downward API is how a replica set
            # gets distinct names without anybody assigning any.
            - name: KFC_GATEWAY_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # "localhost" inside a container means only the container.
            - name: KFC_SERVER_HOST
              value: "0.0.0.0"
          ports:
            - containerPort: 8765
              name: ws
            - containerPort: 9100
              name: obs
          readinessProbe:
            httpGet:
              path: /healthz
              port: obs
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: obs
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              memory: 512Mi
